[package]
name = "egraph"
version = "0.1.0"
edition = "2024"

[dependencies]
egg = "0.11.0"
z3 = { version = "0.12", features = ["static-link-z3"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = "0.252.0"

[dev-dependencies]
wat = "1.252.0"
