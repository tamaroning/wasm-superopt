[project]
name = "ewasm-scripts"
version = "0.1.0"
description = "Utility scripts for ewasm benchmarking"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
r3-run-benchmarks = "r3_bench.run_benchmarks:cli"
r3-merge-csvs = "r3_bench.merge_raw_csvs:cli"
r3-plot = "r3_bench.plot_length_vs_time:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["r3_bench"]
