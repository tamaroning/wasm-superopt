[project]
name = "ewasm-scripts"
version = "0.1.0"
description = "Utility scripts for ewasm benchmarking"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.scripts]
wasm-bench-run = "wasm_bench.run_benchmarks:cli"
wasm-bench-merge = "wasm_bench.merge_raw_csvs:cli"
wasm-bench-plot = "wasm_bench.plot_length_vs_time:cli"
wasm-bench-classify-gaps = "wasm_bench.classify_sat_gaps:cli"
wasm-locals-run = "wasm_bench.run_locals_benchmarks:cli"
wasm-locals-merge = "wasm_bench.merge_locals_csvs:cli"
wasm-locals-plot = "wasm_bench.plot_locals_reduction:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasm_bench"]
